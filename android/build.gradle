apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'ro.amsemnat.expo'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(':expo-modules-core').projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

android {
    namespace 'ro.amsemnat.expo'
    compileSdk safeExtGet('compileSdkVersion', 36)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 24)
        targetSdkVersion safeExtGet('targetSdkVersion', 36)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig false
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
        }
    }
}

dependencies {
    // Phase 4 dev harness: the consumer's settings.gradle injects
    // `includeBuild('../am-semnat-sdk/android')` via the config plugin, so
    // this Maven coordinate resolves to the local `:sdk` module. Phase 7
    // flips this to a plain Maven Central dep.
    implementation 'ro.amsemnat:am-semnat-sdk:0.1.0-SNAPSHOT'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}
